[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "data-science-project"
version = "0.1.0"
description = "A robust and reproducible data science project."
readme = "README.md"
authors = [
  {name = "Juan Jose Rodriguez", email = "rodriguezjuan001@outlook.com"}
]
license = {file = "LICENSE"}
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: GNU Version 2 License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering"
]
keywords = ["data-science", "machine-learning", "pytorch"]
requires-python = ">=3.11"
dependencies = [
    "dvc>=3.50",
    "torch>=2.8.0",
    "torchvision>=0.23.0",
    "numpy>=2.3.0",
    "pandas>=2.3.2",
    "scipy>=1.16.1",
    "scikit-learn>=1.7.0"
]

[project.optional-dependencies]
dev = [
    "ipykernel>=6.29.4",
    "matplotlib>=3.10.6",
    "plotly>=5.21.0",
    "tensorboard>=2.16.2",
    "ruff>=0.4.3",
    "pytest>=8.2.0",
    "black>=24.4.2",
    "dask>=2024.4.2"
]

[tool.setuptools]
packages = ["src"]

[tool.ruff]
line-length = 88
target-version = "py312"
select = [
    "E",  # Error formatting
    "F",  # Pyflakes
    "I",  # isort
    "B"   # Bugbear
]
ignore = [
    "E501" # Line too long (handled by Black)
]

[tool.pytest.ini_options]
addopts = "--strict-markers --cov=src"
testpaths = "tests"